name: PR Size

on:
  # pull_request rather than pull_request_target. zizmor's remediation is to
  # replace the latter "unless you absolutely need repository write
  # permissions", which a pull request from a fork would; release-drafter's own
  # example uses pull_request and reserves the other for forks, and labeler
  # says the same. No repository here takes pull requests from forks.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size:
    name: Label PR by lines changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Apply size label
        # Every input at the action's own default: size/xs to size/xl at 10,
        # 100, 500 and 1000 lines, the job token, and no failure on xl.
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # v1.12.0
