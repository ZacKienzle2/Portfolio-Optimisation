name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --from-ref diffs against the base branch, which needs its history.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # The official action installs pre-commit and caches the hook
      # environments on the configuration's hash, which is the recipe the
      # pre-commit documentation gives for continuous integration.
      #
      # A pull request diffs against its base. A push to main has no base
      # branch, and the push payload's `before` is the tip main had before the
      # push, so the same documented flag pair takes the other documented
      # reference.
      #
      # no-commit-to-branch guards a clone against committing to main directly.
      # On a runner the checkout is main because a commit already reached it,
      # so the hook would fail every push. SKIP is the variable pre-commit
      # documents for leaving a hook out of one run, and the hook keeps
      # guarding every clone.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: no-commit-to-branch
        with:
          extra_args: >-
            --from-ref ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
            --to-ref HEAD --show-diff-on-failure

  gitleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The scan walks history, which needs all of it.
          fetch-depth: 0

      # The pre-commit hook runs `gitleaks git --pre-commit --staged`, which is
      # the right scan while committing and finds nothing on a runner, where
      # nothing is staged. This scans the repository itself, so the check that
      # can fail the build is still here after the lint jobs collapsed into the
      # hooks. The official action replaces an install of ten lines that
      # carried a pinned version and a sha256 no updater could reach inside a
      # run block. It needs a licence key for organisation accounts only.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --verbose --max-concurrency 4 './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  ci-summary:
    name: CI summary gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - pre-commit
      - gitleaks
      - link-check
    if: always()
    steps:
      # re-actors/alls-green is the published form of the gate this step used
      # to hand-roll: it reads the needs context and fails on any failed or
      # cancelled job. The job keeps its name, so what branch protection
      # requires is unchanged.
      - name: Decide whether the needed jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
