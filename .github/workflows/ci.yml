name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # --from-ref diffs against the base branch, which needs its history.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # The official action installs pre-commit and caches the hook
      # environments on the configuration's hash, which is the recipe the
      # pre-commit documentation gives for continuous integration.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: >-
            --from-ref origin/${{ github.base_ref }} --to-ref HEAD
            --show-diff-on-failure

  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2
        with:
          args: --no-progress --verbose --max-concurrency 4 './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

  ci-summary:
    name: CI summary gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - pre-commit
      - link-check
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          set -euo pipefail
          results='${{ toJSON(needs) }}'
          echo "${results}"
          if echo "${results}" | grep -E '"result":\s*"(failure|cancelled)"' > /dev/null; then
            echo "::error::One or more upstream jobs failed or were cancelled."
            exit 1
          fi
