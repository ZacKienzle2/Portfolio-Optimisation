# Executes main.ipynb end to end, which is this repository's own check and
# sits beside the template's Python workflow rather than in it.
name: Notebook

on:
  pull_request:
    branches: [main]
    paths:
      - "main.ipynb"
      - "portfolio_optimisation/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/notebook.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: Notebook execute smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen --all-extras

      - name: Execute main.ipynb
        run: >-
          uv run jupyter nbconvert --to notebook --execute --output main-executed.ipynb
          --ExecutePreprocessor.timeout=600 main.ipynb
