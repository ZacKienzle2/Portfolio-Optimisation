name: LaTeX

on:
  push:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.bst"
      - ".latexmkrc"
      - ".github/workflows/latex.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.bst"
      - ".latexmkrc"
      - ".github/workflows/latex.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build main.tex with TeX Live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build main.tex
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          root_file: main.tex
          latexmk_shell_escape: false
          # -Werror: an undefined reference or citation, or a multiply defined
          # label, fails the build (latexmk 4.69+).
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -Werror

      - name: Upload PDF
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: main
          path: main.pdf
          if-no-files-found: warn
          retention-days: 14
