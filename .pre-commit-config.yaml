default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

default_stages:
  - pre-commit

minimum_pre_commit_version: "3.5.0"

fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: check-json
      - id: check-toml
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-xml
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys", "--indent=2"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: ["--strict", "--config-file=.yamllint.yaml"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2

  # The upstream Go project rather than the Python wrapper, which lags it: the
  # wrapper's newest release is 3.11.1 while the checker is at 4.0.1, and the
  # three versions disagree about this tree by thousands of findings, 6584
  # lines at 3.0.3 against 2261 at 3.11.1 and none from the 4.0.1 the workflow
  # installed. One implementation at one version reports one answer.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.1
    hooks:
      - id: editorconfig-checker

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # Overriding args drops the upstream --write-changes, which the published
  # hook sets by default. The hook is a spell checker with no notion of
  # syntax, and left to rewrite files it edited a latexmk clean-extension list
  # and a set of notebook identifiers. Reporting a suspected typo is useful.
  # Applying the correction unattended is not.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --strict
          - --force-scope
          - feat
          - fix
          - perf
          - refactor
          - docs
          - test
          - build
          - ci
          - chore
          - style
          - revert

  # Prose. The official hook is language: golang, so pre-commit builds vale
  # itself: the binary is present on a CI runner as well as here, and the
  # environment is cached after the first build. The hook entry is the bare
  # vale command, so it does not install what .vale.ini names; the first
  # entry runs `vale sync` for that, which the packages documentation says to
  # do before linting. --no-global reads the repository's configuration
  # alone, so the hook reports the same thing here as on a runner.
  - repo: https://github.com/errata-ai/vale
    rev: v3.9.6
    hooks:
      - id: vale
        alias: vale-sync
        name: vale sync
        args: [sync]
        pass_filenames: false
        files: ^\.vale\.ini$
      - id: vale
        args: [--no-global, --minAlertLevel=error, --output=line]
        types_or: [markdown]
