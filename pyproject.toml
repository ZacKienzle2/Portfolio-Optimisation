[project]
name = "portfolio-optimisation"
version = "0.0.0"
description = "Quant infrastructure for portfolio optimisation and risk modelling."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Zac Kienzle" }]
keywords = [
  "portfolio-optimisation",
  "quantitative-finance",
  "risk-management",
  "hierarchical-risk-parity",
  "copula",
  "cvar",
  "value-at-risk",
  "stochastic-processes",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  # Core numerical stack.
  "numpy>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17.0",
  # Plotting.
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.24",
  # Portfolio + risk.
  "scikit-learn>=1.5",
  "arch>=7.0",
  # Econometrics + statistics.
  "statsmodels>=0.14",
  # Data + reporting.
  "yfinance>=0.2.40",
  "rich>=13.8",
  "lazy-loader>=0.4",
]

[project.scripts]
portfolio-opt = "portfolio_optimisation.cli:main"

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.2", "nbconvert>=7.16"]
optim = [
  # Convex optimisation: the CVaR and CDaR programmes and the efficient
  # frontier. cvxpy brings the Clarabel, OSQP and SCS solvers it defaults to.
  # Opt-in to keep the default install lean. Before 1.9.3 cp.sum took its shape
  # from np.sum over np.empty, which warned at random on uninitialised memory.
  "cvxpy>=1.9.3",
]
docs = [
  # Documentation site built from docstrings and architecture diagrams.
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=1.0.4",
  "pydeps>=3.0.8",
]

[dependency-groups]
# The test suite and measurement packages are the template's, and its
# pyproject.toml gives the reason for each; noxfile.py runs them.
dev = [
  "pytest>=9",
  "pytest-cov>=6",
  "pytest-benchmark>=5",
  "hypothesis[cli]>=6.100",
  "nox>=2025",
  "pytest-randomly>=3",
  "pytest-timeout>=2",
  "pytest-testmon>=2",
  "pyperf>=2.10",
  "deptry>=0.25",
  "tomli-w>=1.2",
  "ruff>=0.7",
  "pyright>=1.1.380",
  "git-cliff>=2.6",
]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_optimisation"]

[tool.uv]
required-version = ">=0.5"

# The width is in ruff.toml, which the template renders and which extends this
# section. ruff skips what .gitignore names on its own.
[tool.ruff]
show-fixes = true

# The Scientific Python Development Guide's selection, as the template renders
# it, which is what repo-review's RF101 reads, plus the pycodestyle warnings and
# eradicate this repository selected before it. ISC is left out because ruff's
# formatter documentation names ISC001 as conflicting with the formatter.
[tool.ruff.lint]
extend-select = [
  "ARG",
  "B",
  "BLE",
  "C4",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "LOG",
  "N",
  "NPY",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Line length is the formatter's.
  "E501",
  # A long message on a built-in exception reads better than a custom class.
  "TRY003",
  # The constructor is documented on the class, which pydoclint's DOC301 asks.
  "D107",
  # Too many arguments, branches or statements, and magic values, which the
  # guide's own template ignores.
  "PLR09",
  "PLR2004",
  # cvxpy, matplotlib and the other heavy optional imports are deferred into
  # the function that needs them, so importing a module stays cheap.
  "PLC0415",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test is named for the property it checks, and pytest reports by that name,
# so test modules and functions carry no docstring.
"tests/**" = ["ARG001", "ARG002", "D100", "D103", "T20"]
# The command-line interface and the notebook print their results.
"src/portfolio_optimisation/cli.py" = ["T20"]
"*.ipynb" = ["T20"]
# The Hypothesis ghostwriter reads these annotations at run time to choose its
# strategies, so the array type is imported outside a type-checking block.
"src/portfolio_optimisation/baselines.py" = ["TC002"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80

# deptry reads the declared dependencies against the imports. The package lives
# under src, which deptry does not look in for first-party names, and
# noxfile.py declares its own dependencies in its PEP 723 block, as algos
# excludes it. The extras below are tools a command runs, and pyarrow is the
# parquet engine pandas loads by name, so none of them is imported.
[tool.deptry]
known_first_party = ["portfolio_optimisation"]
extend_exclude = ["noxfile.py"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyarrow",
  "ipykernel",
  "jupyterlab",
  "nbconvert",
  "mkdocs-material",
  "mkdocstrings",
  "pydeps",
]

# The template's ignore table, whose values repo-review prints as the reason.
[tool.repo-review.ignore]
MY100 = "mypy.ini holds the configuration, and mypy reads it ahead of pyproject.toml"
PC170 = "pygrep-hooks checks reStructuredText, which this repository does not write"
PC140 = "Matches the mirrors-mypy, pyrefly and ty repository URLs alone. mypy runs as a local hook through uv, where the project's own packages resolve, and pyright gates beside it"
RF103 = "ISC is left out because ruff's formatter documentation names ISC001 as conflicting with the formatter"

# The pydoclint hook passes --config=pyproject.toml. The signatures carry the
# types, so the docstrings do not repeat them.
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false

[tool.pyright]
# pyright falls back to the shell's default interpreter when no environment is
# configured, so every uv-managed dependency reads as an unresolved import.
# venvPath and venv are relative, so they are the same for every developer on
# the project; the caution in pyright's docs is about absolute paths.
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["docs", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportImplicitOverride = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"

[[tool.pyright.executionEnvironments]]
# Strict elsewhere; relax library-stub-induced and library-typing-quirk
# diagnostics inside the package. Pyright still enforces structural
# correctness (return types match docstrings, no obvious shape errors)
# via warnings, but library Unknowns do not block CI.
root = "src"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "warning"
reportAssignmentType = "warning"
reportArgumentType = "warning"
reportReturnType = "warning"
reportInvalidTypeForm = "warning"
reportPrivateImportUsage = "warning"

[[tool.pyright.executionEnvironments]]
# Tests construct fixtures from pandas / numpy which surface Unknowns; relax
# the same library-typing diagnostics here.
root = "tests"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "warning"
reportAssignmentType = "warning"
reportArgumentType = "warning"
reportReturnType = "warning"
reportInvalidTypeForm = "warning"
reportPrivateImportUsage = "warning"

# The native [tool.pytest] table pytest 9 reads with TOML types, and `strict`,
# the one switch for strict_config, strict_markers and strict_xfail, as the
# template renders them.
[tool.pytest]
minversion = "9"
strict = true
addopts = ["-ra", "--showlocals", "--tb=short"]
testpaths = ["tests"]
log_cli_level = "INFO"
log_level = "INFO"
# pytest-timeout does nothing until a value is set. This one ends a test that
# has hung without touching a slow one; a mutation run passes a tighter value.
timeout = "300"
filterwarnings = [
  "error",
  # Upstream libraries warn liberally; downgrade to non-fatal in tests.
  # statsmodels' copulas still pass random_state to scipy 1.18, which warns
  # that the keyword is now rng; the call is theirs, not ours.
  "ignore:the 'random_state' keyword is deprecated:FutureWarning",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::PendingDeprecationWarning",
  "ignore:.*scipy.*:DeprecationWarning",
  "ignore:.*statsmodels.*:DeprecationWarning",
  "ignore:.*pandas.*:DeprecationWarning",
  # Matplotlib emits environmental UserWarnings (font fallback, layout) that
  # depend on the host and are not defects in our code.
  "ignore::UserWarning:matplotlib.*",
]

[tool.coverage.run]
source = ["portfolio_optimisation"]
branch = true

[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 75
